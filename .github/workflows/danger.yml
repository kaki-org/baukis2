name: danger

on:
  pull_request:
    types: [ opened, reopened, synchronize ]
    branches-ignore: [ master ]

concurrency:
  group: baukis2-danger-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  danger:
    runs-on: ubuntu-latest
    # erb-lint と同じ only-test キャッシュを共有する（default + test。packwerk / danger-packwerk はどちらもここに入る）
    env:
      BUNDLE_ONLY: test

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: run danger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 既定では fail しても exit 0 で danger/danger の commit status だけ落ちるので、ジョブも落とす
        run: bundle exec danger --fail-on-errors=true
