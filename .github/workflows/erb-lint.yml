name: erb-lint

# *.md / .steering だけの PR では重いジョブを走らせない (#1757)
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.steering/**'
      - '.kiro/steering/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  erb-lint:
    runs-on: ubuntu-latest
    env:
      BUNDLE_ONLY: test
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .tool-versions
          bundler-cache: true
      - name: Run erblint
        run: bundle exec erblint --lint-all
